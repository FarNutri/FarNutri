<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Entrar • FarNutri</title>

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>

    :root{

      --verde-floresta:#0D3B1A;
      --verde-logo:#1A5C2A;
      --verde-marca:#2E7D3F;
      --verde-medio:#4CAF65;

      --branco:#F4FAF5;

      --grafite:#3D4D3E;

      --erro:#E53935;

    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Nunito',sans-serif;
    }

    body{

      min-height:100vh;

      display:flex;

      align-items:center;

      justify-content:center;

      background:
      linear-gradient(
        135deg,
        #EEF7F0,
        #F4FAF5
      );

      padding:20px;

    }

    .login-card{

      width:100%;

      max-width:420px;

      background:white;

      border-radius:30px;

      padding:34px 28px;

      box-shadow:
      0 16px 40px rgba(0,0,0,.08);

    }

    .logo{

      width:74px;
      height:74px;

      margin:0 auto 18px;

      border-radius:22px;

      background:
      linear-gradient(
        135deg,
        var(--verde-logo),
        var(--verde-marca)
      );

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:34px;

      color:white;

      box-shadow:
      0 10px 24px rgba(46,125,63,.22);

    }

    h1{

      text-align:center;

      font-size:34px;

      font-weight:900;

      color:var(--verde-floresta);

    }

    .subtitle{

      margin-top:10px;

      text-align:center;

      color:#6B7A6D;

      font-size:15px;

      line-height:1.5;

    }

    .field{

      margin-top:26px;

    }

    .field label{

      display:block;

      margin-bottom:8px;

      font-size:14px;

      font-weight:800;

      color:var(--grafite);

    }

    .field input{

      width:100%;

      border:none;

      outline:none;

      background:#F7FBF8;

      border:1.5px solid #DCEADF;

      border-radius:18px;

      padding:16px;

      font-size:16px;

      transition:.2s;

    }

    .field input:focus{

      border-color:var(--verde-medio);

      box-shadow:
      0 0 0 4px rgba(76,175,101,.12);

    }

    .login-btn{

      width:100%;

      margin-top:24px;

      border:none;

      background:
      linear-gradient(
        135deg,
        var(--verde-logo),
        var(--verde-marca)
      );

      color:white;

      padding:16px;

      border-radius:18px;

      font-size:16px;

      font-weight:900;

      cursor:pointer;

      transition:.2s;

      box-shadow:
      0 10px 22px rgba(46,125,63,.24);

    }

    .login-btn:hover{

      transform:translateY(-2px);

    }

    .login-btn:active{

      transform:scale(.98);

    }

    .login-btn:disabled{

      opacity:.7;

      cursor:not-allowed;

    }

    .error{

      margin-top:18px;

      background:#FFF1F1;

      color:var(--erro);

      border:1px solid #FFD6D6;

      padding:14px;

      border-radius:14px;

      font-size:14px;

      font-weight:700;

      display:none;

      text-align:center;

    }

    .footer{

      margin-top:24px;

      text-align:center;

      font-size:13px;

      color:#93A095;

    }

  </style>

</head>

<body>

  <div class="login-card">

    <div class="logo">

      🔒

    </div>

    <h1>

      FarNutri

    </h1>

    <div class="subtitle">

      Painel administrativo protegido

    </div>

    <form id="loginForm">

      <div class="field">

        <label>

          Senha de acesso

        </label>

        <input
          type="password"
          id="password"
          placeholder="Digite sua senha"
          required
        />

      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >

        Entrar no painel

      </button>

      <div
        class="error"
        id="errorBox"
      >

        Senha incorreta

      </div>

    </form>

    <div class="footer">

      © FarNutri 2026

    </div>

  </div>

  <script>

    // já autenticado
    const auth =
    localStorage.getItem('adminAuth');

    if(
      auth &&
      typeof auth === 'string' &&
      auth.startsWith('fn_')
    ){

      window.location.href =
      '/painel-farnutri.html';

    }

    document
    .getElementById('loginForm')

    .addEventListener('submit', async (e) => {

      e.preventDefault();

      const password =
      document.getElementById('password').value;

      const errorBox =
      document.getElementById('errorBox');

      const btn =
      document.getElementById('loginBtn');

      btn.innerHTML = 'Entrando...';

      btn.disabled = true;

      errorBox.style.display = 'none';

      try{

        const response =
        await fetch('/api/login',{

          method:'POST',

          headers:{
            'Content-Type':'application/json'
          },

          body:JSON.stringify({
            password
          })

        });

        const data =
        await response.json();

        if(data.success){

          localStorage.setItem(

            'adminAuth',

            'fn_' +
            Math.random()
            .toString(36)
            .substring(2)

          );

          window.location.href =
          '/painel-farnutri.html';

        }else{

          errorBox.innerHTML =
          'Senha incorreta';

          errorBox.style.display =
          'block';

        }

      }catch(error){

        errorBox.innerHTML =
        'Erro ao conectar';

        errorBox.style.display =
        'block';

      }

      btn.innerHTML =
      'Entrar no painel';

      btn.disabled = false;

    });

  </script>

</body>

</html>
