<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FarNutri</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    .hero{
      background:linear-gradient(180deg,#1b8d2b,#45c655);
      color:white;
      padding:40px 20px;
      text-align:center;
    }

    .hero img{
      width:120px;
      height:120px;
      border-radius:50%;
      border:5px solid white;
      object-fit:cover;
      margin-bottom:15px;
    }

    .hero h1{
      font-size:48px;
      margin-bottom:10px;
    }

    .hero p{
      font-size:18px;
      margin:8px 0;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:30px 20px;
    }

    .title{
      font-size:48px;
      color:#138b2a;
      margin-bottom:30px;
      font-weight:bold;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:260px;
      object-fit:cover;
      background:#eee;
    }

    .card-content{
      padding:20px;
    }

    .product-name{
      font-size:24px;
      font-weight:bold;
      margin-bottom:15px;
      min-height:60px;
    }

    .store{
      color:#777;
      margin-bottom:15px;
      font-size:16px;
    }

    .price{
      font-size:40px;
      color:#15952c;
      font-weight:bold;
      margin-bottom:20px;
    }

    .btn{
      display:block;
      width:100%;
      text-align:center;
      background:#16952c;
      color:white;
      text-decoration:none;
      padding:16px;
      border-radius:14px;
      font-size:22px;
      font-weight:bold;
      transition:0.2s;
    }

    .btn:hover{
      background:#0f6f20;
    }

    .loading{
      text-align:center;
      font-size:24px;
      margin-top:50px;
    }

    .error{
      color:red;
      text-align:center;
      font-size:20px;
      margin-top:40px;
    }

    footer{
      background:#145b20;
      color:white;
      text-align:center;
      padding:40px 20px;
      margin-top:60px;
    }

    footer h2{
      font-size:48px;
      margin-bottom:10px;
    }

    footer p{
      font-size:22px;
    }

  </style>
</head>

<body>

  <section class="hero">

    <img
      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
      alt="FarNutri"
    />

    <h1>FarNutri</h1>

    <p>@farnutri.oficial</p>

    <p>🌿 Suplementos e saúde com os melhores preços</p>
    <p>💊 Produtos verificados da Shopee</p>
    <p>✅ Links de afiliado atualizados automaticamente</p>

  </section>

  <div class="container">

    <h2 class="title">
      Suplementos em Destaque
    </h2>

    <div class="loading" id="loading">
      Carregando produtos...
    </div>

    <div class="products" id="products"></div>

  </div>

  <footer>
    <h2>FarNutri</h2>
    <p>Saúde & Nutrição ao seu alcance 🌿</p>
  </footer>

  <script>

    async function loadProducts(){

      const productsContainer =
        document.getElementById("products");

      const loading =
        document.getElementById("loading");

      try{

        const response =
          await fetch("/api/shopee");

        const data =
          await response.json();

        console.log(data);

        loading.style.display = "none";

        if(
          !data.products ||
          data.products.length === 0
        ){

          productsContainer.innerHTML = `
            <p class="error">
              Nenhum produto encontrado.
            </p>
          `;

          return;
        }

        data.products.forEach(product => {

          const card =
            document.createElement("div");

          card.className = "card";

          const image =
            product.imageUrl ||
            product.image ||
            "https://via.placeholder.com/400x400?text=Produto";

          const price =
            Number(
              product.price ||
              product.salePrice ||
              product.priceMin ||
              0
            ).toFixed(2);

          const productName =
            product.productName ||
            product.name ||
            "Produto Shopee";

          const shopName =
            product.shopName ||
            product.store ||
            "Shopee";

          const productLink =
            product.productLink ||
            product.link ||
            "#";

          card.innerHTML = `

            <img
              src="${image}"
              alt="${productName}"
            >

            <div class="card-content">

              <div class="product-name">
                ${productName}
              </div>

              <div class="store">
                Loja: ${shopName}
              </div>

              <div class="price">
                R$ ${price}
              </div>

              <a
                href="${productLink}"
                target="_blank"
                class="btn"
              >
                Comprar Agora
              </a>

            </div>

          `;

          productsContainer.appendChild(card);

        });

      }catch(error){

        console.error(error);

        loading.innerHTML = `
          <p class="error">
            Erro ao carregar produtos.
          </p>
        `;
      }

    }

    loadProducts();

  </script>

</body>
</html>
