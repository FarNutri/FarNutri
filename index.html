<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FarNutri</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    .hero{
      background:linear-gradient(180deg,#1c8f2e,#48c857);
      color:white;
      padding:40px 20px;
      text-align:center;
    }

    .hero img{
      width:120px;
      height:120px;
      border-radius:50%;
      border:5px solid white;
      margin-bottom:15px;
      object-fit:cover;
    }

    .hero h1{
      font-size:42px;
      margin-bottom:5px;
    }

    .hero p{
      margin:8px 0;
      font-size:18px;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:30px 20px;
    }

    .title{
      font-size:36px;
      font-weight:bold;
      margin-bottom:30px;
      color:#1c8f2e;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:16px;
    }

    .product-name{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
      min-height:48px;
    }

    .store{
      color:#777;
      font-size:14px;
      margin-bottom:10px;
    }

    .price{
      font-size:26px;
      color:#1c8f2e;
      font-weight:bold;
      margin-bottom:15px;
    }

    .btn{
      display:block;
      width:100%;
      text-align:center;
      background:#1c8f2e;
      color:white;
      text-decoration:none;
      padding:12px;
      border-radius:10px;
      font-weight:bold;
      transition:0.2s;
    }

    .btn:hover{
      background:#146d22;
    }

    .loading{
      text-align:center;
      font-size:20px;
      margin-top:50px;
    }

    footer{
      margin-top:60px;
      background:#145a20;
      color:white;
      text-align:center;
      padding:30px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="FarNutri">

    <h1>FarNutri</h1>

    <p>@farnutri.oficial</p>

    <p>🌿 Suplementos e saúde com os melhores preços</p>
    <p>💊 Produtos verificados da Shopee</p>
    <p>✅ Links de afiliado atualizados automaticamente</p>
  </section>

  <div class="container">

    <h2 class="title">Suplementos em Destaque</h2>

    <div class="loading" id="loading">
      Carregando produtos...
    </div>

    <div class="products" id="products"></div>

  </div>

  <footer>
    <h2>FarNutri</h2>
    <p>Saúde & Nutrição ao seu alcance 🌿</p>
  </footer>

  <script>
    async function loadProducts() {

      const productsContainer = document.getElementById("products");
      const loading = document.getElementById("loading");

      try {

        const response = await fetch("/api/shopee");

        const data = await response.json();

        loading.style.display = "none";

        if (!data.products || data.products.length === 0) {

          productsContainer.innerHTML = `
            <p>Nenhum produto encontrado.</p>
          `;

          return;
        }

        data.products.forEach(product => {

          const card = document.createElement("div");

          card.className = "card";

          const price = Number(product.price || 0).toFixed(2);

          card.innerHTML = `
            <img src="${product.imageUrl}" alt="${product.productName}">

            <div class="card-content">

              <div class="product-name">
                ${product.productName}
              </div>

              <div class="store">
                Loja: ${product.shopName || "Shopee"}
              </div>

              <div class="price">
                R$ ${price}
              </div>

              <a 
                href="${product.productLink}" 
                target="_blank"
                class="btn"
              >
                Comprar Agora
              </a>

            </div>
          `;

          productsContainer.appendChild(card);

        });

      } catch (error) {

        loading.innerHTML = `
          Erro ao carregar produtos.
        `;

        console.error(error);
      }
    }

    loadProducts();
  </script>

</body>
</html>
