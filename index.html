<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FarNutri</title>

  <style>

    :root{

      --verde-floresta:#0D3B1A;
      --verde-logo:#1A5C2A;
      --verde-marca:#2E7D3F;
      --verde-medio:#4CAF65;
      --verde-folha:#7DC87E;
      --verde-menta:#B8E4BC;

      --branco-natural:#F4FAF5;

      --dourado:#C9A84C;

      --grafite-verde:#3D4D3E;
      --cinza-salvia:#8A9E8C;

    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{

      background:var(--branco-natural);

      color:var(--grafite-verde);

    }

    /* HERO */

    .hero{

      background:
      linear-gradient(
        135deg,
        var(--verde-logo),
        var(--verde-marca)
      );

      padding:35px 25px;

      color:white;

      border-bottom-left-radius:30px;
      border-bottom-right-radius:30px;

      box-shadow:
      0 10px 25px rgba(0,0,0,.15);

    }

    .perfil{

      display:flex;

      align-items:center;

      gap:18px;

    }

    .perfil img{

      width:95px;
      height:95px;

      border-radius:50%;

      object-fit:cover;

      border:4px solid white;

    }

    .perfil-info h1{

      font-size:52px;

      font-weight:800;

      line-height:1;

    }

    .perfil-info p{

      margin-top:8px;

      font-size:18px;

      opacity:.9;

    }

    .bio{

      margin-top:30px;

      display:flex;

      flex-direction:column;

      gap:12px;

      font-size:17px;

      line-height:1.5;

    }

    /* TITULO */

    .section-title{

      padding:
      40px 25px 20px;

      font-size:42px;

      line-height:1.1;

      color:var(--verde-logo);

      font-weight:800;

    }

    /* CATEGORIAS */

    .categories{

      display:flex;

      gap:12px;

      overflow-x:auto;

      padding:0 25px 10px;

      margin-bottom:10px;

      scrollbar-width:none;

    }

    .categories::-webkit-scrollbar{
      display:none;
    }

    .categories button{

      border:none;

      background:white;

      color:var(--verde-logo);

      padding:12px 18px;

      border-radius:999px;

      font-size:15px;

      font-weight:700;

      cursor:pointer;

      white-space:nowrap;

      box-shadow:
      0 4px 12px rgba(0,0,0,.06);

      transition:.2s;

    }

    .categories button.active{

      background:var(--verde-logo);

      color:white;

    }

    /* GRID */

    .products{

      padding:20px 25px;

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(170px,1fr));

      gap:22px;

    }

    /* CARD */

    .card{

      background:white;

      border-radius:28px;

      padding:20px;

      box-shadow:
      0 10px 25px rgba(0,0,0,.06);

      border:1px solid #E8F1EA;

      transition:.2s;

    }

    .card:hover{

      transform:translateY(-4px);

      box-shadow:
      0 14px 35px rgba(0,0,0,.10);

    }

    .card img{

      width:100%;

      height:190px;

      object-fit:contain;

      background:var(--branco-natural);

      border-radius:18px;

      padding:10px;

    }

    .product-name{

      margin-top:18px;

      font-size:22px;

      font-weight:700;

      color:var(--verde-floresta);

      min-height:58px;

    }

    .category{

      margin-top:10px;

      display:inline-block;

      background:var(--verde-menta);

      color:var(--verde-logo);

      padding:6px 14px;

      border-radius:999px;

      font-size:13px;

      font-weight:700;

    }

    /* BOTÕES */

    .buttons{

      margin-top:20px;

      display:flex;

      flex-direction:column;

      gap:12px;

    }

    .btn{

      width:100%;

      border:none;

      border-radius:16px;

      padding:14px;

      color:white;

      text-decoration:none;

      font-weight:700;

      font-size:15px;

      text-align:center;

      transition:.2s;

      display:block;

    }

    .btn:hover{
      transform:scale(1.02);
    }

    .shopee{
      background:#EE4D2D;
    }

    .mercado{
      background:#FFE600;
      color:#333;
    }

    .amazon{
      background:#111111;
    }

    .tiktok{
      background:#000000;
    }

    /* FOOTER */

    footer{

      margin-top:50px;

      background:var(--verde-floresta);

      color:white;

      padding:50px 25px;

      text-align:center;

    }

    footer h2{

      font-size:42px;

      font-weight:800;

    }

    footer p{

      margin-top:12px;

      color:rgba(255,255,255,.85);

      font-size:18px;

    }

    .instagram{

      margin-top:25px;

      display:inline-flex;

      align-items:center;

      gap:12px;

      background:
      rgba(255,255,255,.08);

      padding:14px 20px;

      border-radius:18px;

      text-decoration:none;

      color:white;

      font-weight:700;

      font-size:18px;

    }

    .copyright{

      margin-top:35px;

      color:rgba(255,255,255,.55);

      font-size:14px;

    }

    /* LOADING */

    .loading{

      padding:20px;

      color:var(--cinza-salvia);

      font-size:18px;

    }

  </style>

</head>

<body>

  <!-- HERO -->

  <section class="hero">

    <div class="perfil">

      <img
        src="https://i.imgur.com/8Km9tLL.png"
      />

      <div class="perfil-info">

        <h1>FarNutri</h1>

        <p>@farnutri.suplementos</p>

      </div>

    </div>

    <div class="bio">

      <span>
        🌿 Suplementos e saúde com os melhores preços
      </span>

      <span>
        💊 Produtos verificados
      </span>

      <span>
        ✅ Links atualizados automaticamente
      </span>

    </div>

  </section>

  <!-- TITULO -->

  <h2 class="section-title">

    Suplementos em Destaque

  </h2>

  <!-- CATEGORIAS -->

  <div
    id="categories"
    class="categories"
  ></div>

  <!-- PRODUTOS -->

  <div
    id="products"
    class="products"
  >

    <div class="loading">
      Carregando produtos...
    </div>

  </div>

  <!-- FOOTER -->

  <footer>

    <h2>FarNutri</h2>

    <p>
      Saúde & Nutrição ao seu alcance 🌿
    </p>

    <a
      class="instagram"
      href="https://instagram.com/farnutri.suplementos"
      target="_blank"
    >
      📸 @farnutri.suplementos
    </a>

    <div class="copyright">

      © FarNutri - Todos os direitos reservados.

    </div>

  </footer>

  <script>

    let todosProdutos = [];

    async function carregarProdutos(){

      try{

        const response =
        await fetch('/api/products');

        todosProdutos =
        await response.json();

        criarCategorias();

        renderizarProdutos(todosProdutos);

      }catch(error){

        document
        .getElementById('products')
        .innerHTML = `

          <div class="loading">
            Erro ao carregar produtos.
          </div>

        `;

      }

    }

    function criarCategorias(){

      const container =
      document.getElementById('categories');

      const categorias = [

        'Todos',

        ...new Set(

          todosProdutos

          .map(p => p.category)

          .filter(Boolean)

        )

      ];

      container.innerHTML = '';

      categorias.forEach((categoria,index) => {

        container.innerHTML += `

          <button

            class="${index === 0 ? 'active' : ''}"

            onclick="filtrarCategoria('${categoria}',this)"

          >

            ${categoria}

          </button>

        `;

      });

    }

    function filtrarCategoria(categoria,botao){

      document

      .querySelectorAll('.categories button')

      .forEach(btn => {

        btn.classList.remove('active');

      });

      botao.classList.add('active');

      if(categoria === 'Todos'){

        renderizarProdutos(todosProdutos);

        return;

      }

      const filtrados =

      todosProdutos.filter(

        produto => produto.category === categoria

      );

      renderizarProdutos(filtrados);

    }

    function renderizarProdutos(produtos){

      const container =
      document.getElementById('products');

      container.innerHTML = '';

      produtos.forEach(produto => {

        container.innerHTML += `

          <div class="card">

            <img src="${produto.image}" />

            <div class="product-name">

              ${produto.name}

            </div>

            ${
              produto.category
              ?
              `
              <div class="category">

                ${produto.category}

              </div>
              `
              :
              ''
            }

            <div class="buttons">

              ${
                produto.shopee_link
                ?
                `
                <a
                  href="${produto.shopee_link}"
                  target="_blank"
                  class="btn shopee"
                >
                  Comprar na Shopee
                </a>
                `
                :
                ''
              }

              ${
                produto.mercadolivre_link
                ?
                `
                <a
                  href="${produto.mercadolivre_link}"
                  target="_blank"
                  class="btn mercado"
                >
                  Mercado Livre
                </a>
                `
                :
                ''
              }

              ${
                produto.amazon_link
                ?
                `
                <a
                  href="${produto.amazon_link}"
                  target="_blank"
                  class="btn amazon"
                >
                  Amazon
                </a>
                `
                :
                ''
              }

              ${
                produto.tiktok_link
                ?
                `
                <a
                  href="${produto.tiktok_link}"
                  target="_blank"
                  class="btn tiktok"
                >
                  TikTok Shop
                </a>
                `
                :
                ''
              }

            </div>

          </div>

        `;

      });

    }

    carregarProdutos();

  </script>

</body>
</html>
