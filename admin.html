<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FarNutri Admin</title>

  <style>
    :root{
      --verde-dark:#0D3B1A;
      --verde-logo:#1A5C2A;
      --verde:#2E7D3F;
      --verde-light:#4CAF65;
      --bg:#F4FAF5;
      --grafite:#3D4D3E;
      --cinza:#8A9E8C;

      --shopee:#EE4D2D;
      --mercado:#FFE600;
      --amazon:#111111;
      --tiktok:#000000;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:var(--bg);
      padding:25px;
      color:var(--grafite);
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      border-radius:30px;
      padding:35px;
      box-shadow:0 8px 25px rgba(0,0,0,.08);
    }

    h1{
      text-align:center;
      color:var(--verde);
      font-size:58px;
      margin-bottom:10px;
      font-weight:900;
    }

    .subtitle{
      text-align:center;
      color:var(--cinza);
      margin-bottom:40px;
      font-size:24px;
    }

    .input{
      width:100%;
      height:65px;
      border-radius:18px;
      border:2px solid #E7ECE8;
      padding:0 20px;
      font-size:18px;
      margin-bottom:18px;
      outline:none;
      transition:.2s;
    }

    .input:focus{
      border-color:var(--verde-light);
    }

    .btn{
      width:100%;
      height:65px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,var(--verde),var(--verde-light));
      color:white;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      margin-top:10px;
      transition:.2s;
    }

    .btn:hover{
      transform:scale(1.01);
    }

    .section-title{
      margin-top:55px;
      margin-bottom:25px;
      font-size:42px;
      color:var(--verde);
      font-weight:900;
    }

    .products{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    .card{
      background:white;
      border-radius:25px;
      padding:25px;
      box-shadow:0 6px 18px rgba(0,0,0,.07);
      border:1px solid #edf2ee;
    }

    .card img{
      width:140px;
      height:140px;
      object-fit:cover;
      border-radius:18px;
      display:block;
      margin:auto;
      background:#fff;
    }

    .product-name{
      text-align:center;
      font-size:28px;
      font-weight:800;
      margin-top:20px;
      color:var(--grafite);
    }

    .category{
      text-align:center;
      margin-top:10px;
      color:var(--verde);
      font-weight:700;
      font-size:18px;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:25px;
    }

    .market-btn{
      height:50px;
      border:none;
      border-radius:14px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }

    .shopee{
      background:var(--shopee);
      color:white;
    }

    .mercado{
      background:var(--mercado);
      color:black;
    }

    .amazon{
      background:var(--amazon);
      color:white;
    }

    .tiktok{
      background:var(--tiktok);
      color:white;
      border:1px solid #25F4EE;
    }

    .edit{
      background:#C9A84C;
      color:white;
    }

    .delete{
      background:#d62828;
      color:white;
    }

    .loading{
      text-align:center;
      color:var(--cinza);
      font-size:18px;
    }

  </style>
</head>
<body>

<div class="container">

  <h1>FarNutri</h1>
  <p class="subtitle">Painel Administrativo</p>

  <input type="hidden" id="productId">

  <input class="input" type="text" id="name" placeholder="Nome do produto">

  <input class="input" type="text" id="image" placeholder="URL da imagem">

  <input class="input" type="text" id="category" placeholder="Categoria">

  <input class="input" type="text" id="shopee_link" placeholder="Link Shopee">

  <input class="input" type="text" id="mercadolivre_link" placeholder="Link Mercado Livre">

  <input class="input" type="text" id="amazon_link" placeholder="Link Amazon">

  <input class="input" type="text" id="tiktok_link" placeholder="Link TikTok">

  <button class="btn" onclick="saveProduct()">
    Salvar Produto
  </button>

  <h2 class="section-title">Produtos cadastrados</h2>

  <div class="products" id="products">
    <p class="loading">Carregando produtos...</p>
  </div>

</div>

<script>

let editingId = null;

async function loadProducts(){

  const container = document.getElementById('products');

  try{

    const response = await fetch('/api/products');

    const products = await response.json();

    if(!products.length){
      container.innerHTML = '<p class="loading">Nenhum produto cadastrado.</p>';
      return;
    }

    container.innerHTML = '';

    products.forEach(product => {

      container.innerHTML += `
      
      <div class="card">

        <img src="${product.image}" />

        <div class="product-name">
          ${product.name}
        </div>

        <div class="category">
          ${product.category || ''}
        </div>

        <div class="buttons">

          ${
            product.shopee_link
            ?
            `<a href="${product.shopee_link}" target="_blank">
              <button class="market-btn shopee">
                🛒 Shopee
              </button>
            </a>`
            :
            ''
          }

          ${
            product.mercadolivre_link
            ?
            `<a href="${product.mercadolivre_link}" target="_blank">
              <button class="market-btn mercado">
                Mercado Livre
              </button>
            </a>`
            :
            ''
          }

          ${
            product.amazon_link
            ?
            `<a href="${product.amazon_link}" target="_blank">
              <button class="market-btn amazon">
                Amazon
              </button>
            </a>`
            :
            ''
          }

          ${
            product.tiktok_link
            ?
            `<a href="${product.tiktok_link}" target="_blank">
              <button class="market-btn tiktok">
                TikTok Shop
              </button>
            </a>`
            :
            ''
          }

          <button 
            class="market-btn edit"
            onclick='editProduct(${JSON.stringify(product)})'
          >
            Editar
          </button>

          <button 
            class="market-btn delete"
            onclick="deleteProduct(${product.id})"
          >
            Excluir
          </button>

        </div>

      </div>

      `;

    });

  }catch(error){

    container.innerHTML = `
      <p class="loading">
        Erro ao carregar produtos
      </p>
    `;

  }

}

function editProduct(product){

  editingId = product.id;

  document.getElementById('name').value = product.name || '';
  document.getElementById('image').value = product.image || '';
  document.getElementById('category').value = product.category || '';

  document.getElementById('shopee_link').value = product.shopee_link || '';

  document.getElementById('mercadolivre_link').value = product.mercadolivre_link || '';

  document.getElementById('amazon_link').value = product.amazon_link || '';

  document.getElementById('tiktok_link').value = product.tiktok_link || '';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

async function saveProduct(){

  const data = {

    id: editingId,

    name: document.getElementById('name').value,

    image: document.getElementById('image').value,

    category: document.getElementById('category').value,

    shopee_link: document.getElementById('shopee_link').value,

    mercadolivre_link: document.getElementById('mercadolivre_link').value,

    amazon_link: document.getElementById('amazon_link').value,

    tiktok_link: document.getElementById('tiktok_link').value

  };

  const endpoint = editingId
    ? '/api/edit-product'
    : '/api/update-products';

  try{

    const response = await fetch(endpoint,{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify(data)
    });

    const result = await response.json();

    if(result.success){

      alert(
        editingId
        ? 'Produto atualizado com sucesso'
        : 'Produto cadastrado com sucesso'
      );

      clearForm();

      loadProducts();

    }else{

      alert('Erro ao salvar produto');

    }

  }catch(error){

    alert('Erro ao salvar produto');

  }

}

async function deleteProduct(id){

  const confirmDelete = confirm(
    'Deseja excluir este produto?'
  );

  if(!confirmDelete) return;

  try{

    const response = await fetch('/api/delete-product',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({ id })
    });

    const result = await response.json();

    if(result.success){

      alert('Produto excluído');

      loadProducts();

    }else{

      alert('Erro ao excluir');

    }

  }catch(error){

    alert('Erro ao excluir');

  }

}

function clearForm(){

  editingId = null;

  document.getElementById('name').value = '';

  document.getElementById('image').value = '';

  document.getElementById('category').value = '';

  document.getElementById('shopee_link').value = '';

  document.getElementById('mercadolivre_link').value = '';

  document.getElementById('amazon_link').value = '';

  document.getElementById('tiktok_link').value = '';

}

loadProducts();

</script>

</body>
</html>
