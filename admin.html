<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin FarNutri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f3f3;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:18px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0a8f2d;
    font-size:42px;
}

.logo p{
    color:#666;
    margin-top:6px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:16px;
    background:#0a8f2d;
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

.success{
    margin-top:18px;
    background:#dff5e4;
    color:#14732d;
    padding:12px;
    border-radius:10px;
    display:none;
}

.error{
    margin-top:18px;
    background:#ffe4e4;
    color:#b42323;
    padding:12px;
    border-radius:10px;
    display:none;
}

</style>

</head>
<body>

<div class="container">

    <div class="logo">

        <h1>FarNutri</h1>

        <p>Painel Administrativo</p>

    </div>

    <input 
        type="text" 
        id="name" 
        placeholder="Nome do produto"
    >

    <input 
        type="text" 
        id="image" 
        placeholder="URL da imagem"
    >

    <input 
        type="number" 
        id="price" 
        placeholder="Preço"
    >

    <input 
        type="text" 
        id="link" 
        placeholder="Link afiliado"
    >

    <button onclick="addProduct()">
        Adicionar Produto
    </button>

    <div class="success" id="success">
        Produto adicionado com sucesso!
    </div>

    <div class="error" id="error">
        Erro ao adicionar produto.
    </div>

</div>

<script>

const SUPABASE_URL =
'https://qmdpnbbwtqsaabxmumot.supabase.co';

const SUPABASE_KEY =
'sb_publishable_HouxuKG3CFe1ddcr5zRiSw_RZGxbp_L';

const client =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function addProduct(){

    const success =
        document.getElementById('success');

    const errorDiv =
        document.getElementById('error');

    success.style.display = 'none';
    errorDiv.style.display = 'none';

    const name =
        document.getElementById('name').value;

    const image =
        document.getElementById('image').value;

    const price =
        document.getElementById('price').value;

    const link =
        document.getElementById('link').value;

    if(!name || !image || !price || !link){

        errorDiv.innerHTML =
            'Preencha todos os campos';

        errorDiv.style.display = 'block';

        return;

    }

    const { error } =
        await client
        .from('products')
        .insert([{

            name: name,

            image: image,

            price: Number(price),

            affiliate_link: link,

            store: 'FarNutri',

            category: 'Suplementos'

        }]);

    if(error){

        errorDiv.innerHTML =
            error.message;

        errorDiv.style.display = 'block';

        return;

    }

    success.style.display = 'block';

    document.getElementById('name').value = '';
    document.getElementById('image').value = '';
    document.getElementById('price').value = '';
    document.getElementById('link').value = '';

}

</script>

</body>
</html>
