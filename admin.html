<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FarNutri Admin</title>

  <style>

    :root{

      --verde-floresta:#0D3B1A;
      --verde-logo:#1A5C2A;
      --verde-marca:#2E7D3F;
      --verde-medio:#4CAF65;
      --verde-folha:#7DC87E;
      --verde-menta:#B8E4BC;

      --branco-natural:#F4FAF5;

      --grafite-verde:#3D4D3E;
      --cinza-salvia:#8A9E8C;

      --shopee:#EE4D2D;
      --mercado:#FFE600;
      --amazon:#131A22;
      --tiktok:#000000;

    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{

      background:var(--branco-natural);

      padding:25px;

      color:var(--grafite-verde);

    }

    .container{

      max-width:760px;

      margin:auto;

      background:white;

      border-radius:30px;

      padding:35px;

      box-shadow:
      0 10px 30px rgba(0,0,0,.08);

    }

    h1{

      text-align:center;

      color:var(--verde-logo);

      font-size:58px;

      font-weight:900;

    }

    .subtitle{

      text-align:center;

      color:var(--cinza-salvia);

      margin-top:8px;

      margin-bottom:35px;

      font-size:20px;

    }

    .input{

      width:100%;

      height:62px;

      border-radius:18px;

      border:2px solid #E7ECE8;

      padding:0 18px;

      margin-bottom:18px;

      font-size:16px;

      outline:none;

      transition:.2s;

    }

    .input:focus{

      border-color:
      var(--verde-medio);

    }

    textarea.input{

      height:110px;

      padding:18px;

      resize:none;

    }

    .btn{

      width:100%;

      height:65px;

      border:none;

      border-radius:18px;

      background:
      linear-gradient(
        135deg,
        var(--verde-logo),
        var(--verde-marca)
      );

      color:white;

      font-size:20px;

      font-weight:700;

      cursor:pointer;

      transition:.2s;

      margin-top:10px;

    }

    .btn:hover{

      transform:scale(1.01);

    }

    .section-title{

      margin-top:55px;

      margin-bottom:25px;

      font-size:38px;

      color:var(--verde-logo);

      font-weight:800;

    }

    .products{

      display:flex;

      flex-direction:column;

      gap:22px;

    }

    .card{

      position:relative;

      background:white;

      border-radius:28px;

      padding:22px;

      border:1px solid #E8F1EA;

      box-shadow:
      0 8px 22px rgba(0,0,0,.06);

    }

    /* BADGE */

    .badge{

      position:absolute;

      top:15px;
      left:15px;

      padding:8px 12px;

      border-radius:999px;

      font-size:12px;

      font-weight:700;

      color:white;

      z-index:2;

    }

    .best{
      background:#FF5A36;
    }

    .verified{
      background:#2E7D3F;
    }

    .rated{
      background:#F4B400;
    }

    .performance{
      background:#146EB4;
    }

    .energy{
      background:#7B2CBF;
    }

    .shipping{
      background:#00A86B;
    }

    .card img{

      width:140px;
      height:140px;

      object-fit:contain;

      display:block;

      margin:auto;

      background:var(--branco-natural);

      border-radius:18px;

      padding:10px;

    }

    .product-name{

      margin-top:18px;

      font-size:26px;

      font-weight:800;

      text-align:center;

      color:var(--verde-floresta);

    }

    .description{

      margin-top:10px;

      text-align:center;

      color:var(--cinza-salvia);

      font-size:14px;

      line-height:1.5;

    }

    .category{

      margin-top:12px;

      display:inline-block;

      background:var(--verde-menta);

      color:var(--verde-logo);

      padding:6px 14px;

      border-radius:999px;

      font-size:13px;

      font-weight:700;

    }

    .category-wrap{
      text-align:center;
    }

    .buttons{

      margin-top:20px;

      display:flex;

      flex-direction:column;

      gap:10px;

    }

    .market-btn{

      border:none;

      height:48px;

      border-radius:14px;

      font-size:15px;

      font-weight:700;

      cursor:pointer;

      width:100%;

    }

    .shopee{
      background:var(--shopee);
      color:white;
    }

    .mercado{
      background:var(--mercado);
      color:black;
    }

    .amazon{
      background:var(--amazon);
      color:white;
    }

    .tiktok{
      background:var(--tiktok);
      color:white;
      border:1px solid #25F4EE;
    }

    .edit{
      background:#C9A84C;
      color:white;
    }

    .delete{
      background:#d62828;
      color:white;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>FarNutri</h1>

    <p class="subtitle">

      Painel Administrativo

    </p>

    <input
      type="hidden"
      id="productId"
    />

    <input
      class="input"
      type="text"
      id="name"
      placeholder="Nome do produto"
    />

    <textarea
      class="input"
      id="description"
      placeholder="Descrição curta"
    ></textarea>

    <input
      class="input"
      type="text"
      id="badge"
      placeholder="Badge (🔥 Mais Vendido)"
    />

    <input
      class="input"
      type="text"
      id="image"
      placeholder="URL da imagem"
    />

    <input
      class="input"
      type="text"
      id="category"
      placeholder="Categoria"
    />

    <input
      class="input"
      type="text"
      id="shopee_link"
      placeholder="Link Shopee"
    />

    <input
      class="input"
      type="text"
      id="mercadolivre_link"
      placeholder="Link Mercado Livre"
    />

    <input
      class="input"
      type="text"
      id="amazon_link"
      placeholder="Link Amazon"
    />

    <input
      class="input"
      type="text"
      id="tiktok_link"
      placeholder="Link TikTok"
    />

    <button
      class="btn"
      onclick="saveProduct()"
    >
      Salvar Produto
    </button>

    <h2 class="section-title">

      Produtos cadastrados

    </h2>

    <div
      class="products"
      id="products"
    ></div>

  </div>

  <script>

    let editingId = null;

    function getBadgeClass(badge){

      if(!badge) return '';

      if(badge.includes('Mais Vendido'))
        return 'badge best';

      if(badge.includes('Verificado'))
        return 'badge verified';

      if(badge.includes('Melhor Avaliado'))
        return 'badge rated';

      if(badge.includes('Alta Performance'))
        return 'badge performance';

      if(badge.includes('Energia Extra'))
        return 'badge energy';

      if(badge.includes('Envio Rápido'))
        return 'badge shipping';

      return 'badge';

    }

    async function loadProducts(){

      const container =
      document.getElementById('products');

      try{

        const response =
        await fetch('/api/products');

        const products =
        await response.json();

        container.innerHTML = '';

        products.forEach(product => {

          container.innerHTML += `

            <div class="card">

              ${
                product.badge
                ?
                `
                <div class="${getBadgeClass(product.badge)}">
                  ${product.badge}
                </div>
                `
                :
                ''
              }

              <img src="${product.image}" />

              <div class="product-name">

                ${product.name}

              </div>

              ${
                product.description
                ?
                `
                <div class="description">

                  ${product.description}

                </div>
                `
                :
                ''
              }

              ${
                product.category
                ?
                `
                <div class="category-wrap">

                  <div class="category">

                    ${product.category}

                  </div>

                </div>
                `
                :
                ''
              }

              <div class="buttons">

                ${
                  product.shopee_link
                  ?
                  `
                  <a
                    href="${product.shopee_link}"
                    target="_blank"
                  >
                    <button class="market-btn shopee">
                      🛒 Shopee
                    </button>
                  </a>
                  `
                  :
                  ''
                }

                ${
                  product.mercadolivre_link
                  ?
                  `
                  <a
                    href="${product.mercadolivre_link}"
                    target="_blank"
                  >
                    <button class="market-btn mercado">
                      Mercado Livre
                    </button>
                  </a>
                  `
                  :
                  ''
                }

                ${
                  product.amazon_link
                  ?
                  `
                  <a
                    href="${product.amazon_link}"
                    target="_blank"
                  >
                    <button class="market-btn amazon">
                      Amazon
                    </button>
                  </a>
                  `
                  :
                  ''
                }

                ${
                  product.tiktok_link
                  ?
                  `
                  <a
                    href="${product.tiktok_link}"
                    target="_blank"
                  >
                    <button class="market-btn tiktok">
                      TikTok Shop
                    </button>
                  </a>
                  `
                  :
                  ''
                }

                <button
                  class="market-btn edit"
                  onclick='editProduct(${JSON.stringify(product)})'
                >
                  Editar
                </button>

                <button
                  class="market-btn delete"
                  onclick="deleteProduct(${product.id})"
                >
                  Excluir
                </button>

              </div>

            </div>

          `;

        });

      }catch(error){

        container.innerHTML =
        'Erro ao carregar produtos';

      }

    }

    function editProduct(product){

      editingId = product.id;

      document.getElementById('name').value =
      product.name || '';

      document.getElementById('description').value =
      product.description || '';

      document.getElementById('badge').value =
      product.badge || '';

      document.getElementById('image').value =
      product.image || '';

      document.getElementById('category').value =
      product.category || '';

      document.getElementById('shopee_link').value =
      product.shopee_link || '';

      document.getElementById('mercadolivre_link').value =
      product.mercadolivre_link || '';

      document.getElementById('amazon_link').value =
      product.amazon_link || '';

      document.getElementById('tiktok_link').value =
      product.tiktok_link || '';

      window.scrollTo({
        top:0,
        behavior:'smooth'
      });

    }

    async function saveProduct(){

      const data = {

        id: editingId,

        name:
        document.getElementById('name').value,

        description:
        document.getElementById('description').value,

        badge:
        document.getElementById('badge').value,

        image:
        document.getElementById('image').value,

        category:
        document.getElementById('category').value,

        shopee_link:
        document.getElementById('shopee_link').value,

        mercadolivre_link:
        document.getElementById('mercadolivre_link').value,

        amazon_link:
        document.getElementById('amazon_link').value,

        tiktok_link:
        document.getElementById('tiktok_link').value

      };

      const endpoint = editingId
      ?
      '/api/edit-product'
      :
      '/api/update-products';

      try{

        const response = await fetch(endpoint,{

          method:'POST',

          headers:{
            'Content-Type':'application/json'
          },

          body:JSON.stringify(data)

        });

        const result =
        await response.json();

        if(result.success){

          alert(
            editingId
            ?
            'Produto atualizado'
            :
            'Produto cadastrado'
          );

          clearForm();

          loadProducts();

        }else{

          alert('Erro ao salvar');

        }

      }catch(error){

        alert('Erro ao salvar');

      }

    }

    async function deleteProduct(id){

      if(!confirm(
        'Deseja excluir este produto?'
      )) return;

      try{

        const response =
        await fetch('/api/delete-product',{

          method:'POST',

          headers:{
            'Content-Type':'application/json'
          },

          body:JSON.stringify({ id })

        });

        const result =
        await response.json();

        if(result.success){

          alert('Produto excluído');

          loadProducts();

        }else{

          alert('Erro ao excluir');

        }

      }catch(error){

        alert('Erro ao excluir');

      }

    }

    function clearForm(){

      editingId = null;

      document.getElementById('name').value = '';

      document.getElementById('description').value = '';

      document.getElementById('badge').value = '';

      document.getElementById('image').value = '';

      document.getElementById('category').value = '';

      document.getElementById('shopee_link').value = '';

      document.getElementById('mercadolivre_link').value = '';

      document.getElementById('amazon_link').value = '';

      document.getElementById('tiktok_link').value = '';

    }

    loadProducts();

  </script>

</body>

</html>
