<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>FarNutri Admin</title>

<style>

body{
  margin:0;
  padding:30px;
  background:#f3f3f3;
  font-family:Arial;
}

.painel{
  max-width:700px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:25px;
}

h1{
  text-align:center;
  color:#00a321;
  font-size:60px;
  margin:0;
}

.sub{
  text-align:center;
  color:#666;
  margin-bottom:40px;
}

input{
  width:100%;
  height:65px;
  margin-bottom:20px;
  border-radius:20px;
  border:1px solid #ccc;
  padding:0 20px;
  font-size:26px;
  box-sizing:border-box;
}

button{
  width:100%;
  height:70px;
  border:none;
  border-radius:20px;
  font-size:30px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#00b51a;
  color:#fff;
  margin-bottom:40px;
}

h2{
  color:#00a321;
  font-size:55px;
}

#produtos{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.produto-card{
  background:#f7f7f7;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.produto-card img{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:15px;
}

.produto-card h3{
  font-size:35px;
}

.produto-card p{
  font-size:30px;
  color:#00a321;
  font-weight:bold;
}

.editar{
  background:#ffb300;
  color:#fff;
  margin-bottom:10px;
}

.excluir{
  background:#ff2a2a;
  color:#fff;
}

</style>
</head>
<body>

<div class="painel">

<h1>FarNutri</h1>
<p class="sub">Painel Administrativo</p>

<input type="text" id="name" placeholder="Nome do produto">

<input type="text" id="image" placeholder="URL da imagem">

<input type="text" id="price" placeholder="Preço">

<input type="text" id="link" placeholder="Link afiliado">

<button class="btn" id="btn" onclick="salvarProduto()">
Adicionar Produto
</button>

<h2>Produtos cadastrados</h2>

<div id="produtos"></div>

</div>

<script>

let produtoEditando = null

async function carregarProdutos(){

  const res = await fetch('/api/products')

  const produtos = await res.json()

  const container = document.getElementById('produtos')

  container.innerHTML = ''

  produtos.forEach(produto => {

    container.innerHTML += `
      <div class="produto-card">

        <img src="${produto.image}" />

        <h3>${produto.name}</h3>

        <p>R$ ${produto.price}</p>

        <button
          class="editar"
          onclick='editarProduto(${JSON.stringify(produto)})'
        >
          Editar
        </button>

        <button
          class="excluir"
          onclick="deletarProduto(${produto.id})"
        >
          Excluir
        </button>

      </div>
    `

  })

}

function editarProduto(produto){

  produtoEditando = Number(produto.id)

  document.getElementById('name').value = produto.name || ''
  document.getElementById('image').value = produto.image || ''
  document.getElementById('price').value = produto.price || ''
  document.getElementById('link').value = produto.link || ''

  document.getElementById('btn').innerText = 'Salvar Produto'

}

async function salvarProduto(){

  const body = {
    name: document.getElementById('name').value,
    image: document.getElementById('image').value,
    price: document.getElementById('price').value,
    link: document.getElementById('link').value
  }

  let url = '/api/update-products'

  if(produtoEditando){

    url = '/api/edit-product'

    body.id = produtoEditando

  }

  const res = await fetch(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body: JSON.stringify(body)
  })

  const data = await res.json()

  if(data.success){

    alert('Produto salvo com sucesso')

    produtoEditando = null

    document.getElementById('btn').innerText = 'Adicionar Produto'

    document.getElementById('name').value = ''
    document.getElementById('image').value = ''
    document.getElementById('price').value = ''
    document.getElementById('link').value = ''

    carregarProdutos()

  }else{

    alert(data.error || 'Erro ao salvar produto')

  }

}

async function deletarProduto(id){

  if(!confirm('Deseja excluir este produto?')) return

  const res = await fetch('/api/delete-product',{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body: JSON.stringify({ id })
  })

  const data = await res.json()

  if(data.success){

    alert('Produto excluído')

    carregarProdutos()

  }else{

    alert('Erro ao excluir')

  }

}

carregarProdutos()

</script>

</body>
</html>
