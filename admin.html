<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin FarNutri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
    font-family:Arial;
    background:#f3f3f3;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    background:#0a8f2d;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<h1>Adicionar Produto</h1>

<input type="text" id="name" placeholder="Nome do produto">

<input type="text" id="image" placeholder="URL da imagem">

<input type="text" id="price" placeholder="Preço">

<input type="text" id="link" placeholder="Link afiliado">

<button onclick="addProduct()">
Adicionar Produto
</button>

</div>

<script>

const SUPABASE_URL =
'https://SEU-PROJETO.supabase.co';

const SUPABASE_KEY =
'SUA_PUBLISHABLE_KEY';

const client =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function addProduct(){

    const name =
        document.getElementById('name').value;

    const image =
        document.getElementById('image').value;

    const price =
        document.getElementById('price').value;

    const link =
        document.getElementById('link').value;

    const { error } =
        await client
        .from('products')
        .insert([{

            name,
            image,
            price,
            affiliate_link: link

        }]);

    if(error){

        alert(error.message);
        return;

    }

    alert('Produto adicionado!');

}

</script>

</body>
</html>
