<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FarNutri Admin</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f3f3f3;
      padding:20px;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:25px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    h1{
      color:#08a317;
      font-size:60px;
      text-align:center;
      margin-bottom:10px;
    }

    .sub{
      text-align:center;
      color:#666;
      margin-bottom:35px;
      font-size:22px;
    }

    input{
      width:100%;
      padding:18px;
      border-radius:15px;
      border:1px solid #ccc;
      margin-bottom:18px;
      font-size:18px;
    }

    button{
      width:100%;
      border:none;
      padding:18px;
      border-radius:15px;
      background:#08a317;
      color:white;
      font-size:22px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    .titulo-produtos{
      margin-top:50px;
      margin-bottom:25px;
      font-size:32px;
      color:#08a317;
      font-weight:bold;
    }

    .produto{
      background:#f7f7f7;
      border-radius:20px;
      padding:15px;
      margin-bottom:20px;
      display:flex;
      gap:15px;
      align-items:center;
    }

    .produto img{
      width:90px;
      height:90px;
      object-fit:contain;
      background:white;
      border-radius:15px;
      padding:8px;
    }

    .produto-info{
      flex:1;
    }

    .produto-info h3{
      font-size:18px;
      margin-bottom:8px;
    }

    .produto-info p{
      color:#08a317;
      font-size:20px;
      font-weight:bold;
    }

    .acoes{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .btn-editar{
      background:#f4a100;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-excluir{
      background:#d40000;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    @media(max-width:768px){

      h1{
        font-size:40px;
      }

      .sub{
        font-size:18px;
      }

      .produto{
        flex-direction:column;
        text-align:center;
      }

      .acoes{
        width:100%;
      }

      .btn-editar,
      .btn-excluir{
        width:100%;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>FarNutri</h1>

    <div class="sub">
      Painel Administrativo
    </div>

    <input type="hidden" id="produtoId">

    <input
      type="text"
      id="name"
      placeholder="Nome do produto"
    >

    <input
      type="text"
      id="image"
      placeholder="URL da imagem"
    >

    <input
      type="text"
      id="price"
      placeholder="Preço"
    >

    <input
      type="text"
      id="link"
      placeholder="Link afiliado"
    >

    <button onclick="salvarProduto()">
      Salvar Produto
    </button>

    <div class="titulo-produtos">
      Produtos cadastrados
    </div>

    <div id="listaProdutos">
      Carregando produtos...
    </div>

  </div>

  <script>

    async function carregarProdutos(){

      const response = await fetch('/api/products')

      const produtos = await response.json()

      const lista = document.getElementById('listaProdutos')

      lista.innerHTML = ''

      produtos.forEach(produto => {

        lista.innerHTML += `

          <div class="produto">

            <img src="${produto.image}">

            <div class="produto-info">

              <h3>${produto.name}</h3>

              <p>R$ ${produto.price}</p>

            </div>

            <div class="acoes">

              <button
                class="btn-editar"
                onclick='editarProduto(${JSON.stringify(produto)})'
              >
                Editar
              </button>

              <button
                class="btn-excluir"
                onclick='excluirProduto(${produto.id})'
              >
                Excluir
              </button>

            </div>

          </div>

        `

      })

    }

    function editarProduto(produto){

      document.getElementById('produtoId').value = produto.id

      document.getElementById('name').value = produto.name

      document.getElementById('image').value = produto.image

      document.getElementById('price').value = produto.price

      document.getElementById('link').value = produto.link

      window.scrollTo({
        top:0,
        behavior:'smooth'
      })

    }

    async function salvarProduto(){

      const id = document.getElementById('produtoId').value

      const produto = {

        name: document.getElementById('name').value,

        image: document.getElementById('image').value,

        price: document.getElementById('price').value,

        link: document.getElementById('link').value

      }

      let url = '/api/update-products'

      if(id){

        produto.id = id

        url = '/api/edit-product'

      }

      const response = await fetch(url, {

        method:'POST',

        headers:{
          'Content-Type':'application/json'
        },

        body: JSON.stringify(produto)

      })

      const result = await response.json()

      if(result.success){

        alert('Produto salvo com sucesso!')

        limparFormulario()

        carregarProdutos()

      }else{

        alert('Erro ao salvar produto')

      }

    }

    async function excluirProduto(id){

      const confirmar = confirm('Deseja excluir este produto?')

      if(!confirmar) return

      const response = await fetch('/api/delete-product', {

        method:'POST',

        headers:{
          'Content-Type':'application/json'
        },

        body: JSON.stringify({ id })

      })

      const result = await response.json()

      if(result.success){

        alert('Produto excluído!')

        carregarProdutos()

      }else{

        alert('Erro ao excluir')

      }

    }

    function limparFormulario(){

      document.getElementById('produtoId').value = ''

      document.getElementById('name').value = ''

      document.getElementById('image').value = ''

      document.getElementById('price').value = ''

      document.getElementById('link').value = ''

    }

    carregarProdutos()

  </script>

</body>
</html>
